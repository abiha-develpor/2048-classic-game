<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">

        <header class="game-header">
            <div>
                <h1>2048</h1>
                <p>Join the numbers and get to 2048!</p>
            </div>

            <div class="score-box">
                <span>Score</span>
                <strong id="score">0</strong>
            </div>
        </header>

        <div class="game-actions">
            <button id="new-game">New Game</button>
        </div>

        <section class="game-board" id="game-board" aria-label="2048 game board">
            <!-- Tiles are generated by JavaScript -->
        </section>

        <div class="controls">
            <p><strong>Controls:</strong></p>
            <div class="keys">
                <span>↑</span>
                <span>W</span>
                <span>A</span>
                <span>S</span>
                <span>D</span>
                <span>↓</span>
                <span>←</span>
                <span>→</span>
            </div>
        </div>

        <p class="instructions">
            Use your keyboard arrows or W/A/S/D to move the tiles.
        </p>

        <div class="message-overlay hidden" id="message-overlay">
            <div class="message-box">
                <h2 id="message-title">You Win!</h2>
                <p id="message-text">You reached 2048!</p>
                <button id="restart-game">Play Again</button>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
